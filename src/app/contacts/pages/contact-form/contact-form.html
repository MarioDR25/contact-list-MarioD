<form
  (submit)="onSubmit($event, miForm)"
  #miForm="ngForm"
  class="w-md mx-auto mt-20 p-8 flex flex-col items-center gap-5 border border-slate-700 shadow-2xl rounded-xl bg-slate-800">
  <h2 class="text-2xl font-bold text-slate-200 mb-2">
    {{ isEditMode() ? 'Edit Contact' : 'Create Contact' }}
  </h2>

  <!-- Full Name -->
  <div class="flex flex-col gap-1.5 w-full">
    <label for="full-name" class="text-sm text-slate-400 w-4/5 self-center"> Full Name </label>
    <input
      type="text"
      id="full-name"
      [ngModel]="contactStore.contactEdit()?.name"
      name="name"
      required
      class="px-3 py-1.5 text-md placeholder:text-slate-600 border text-slate-200 border-slate-700 rounded-md bg-slate-900 w-4/5 self-center focus:outline-none focus:ring-2 focus:ring-slate-600" />
  </div>

  <!-- Email -->
  <div class="flex flex-col gap-1.5 w-full">
    <label for="email" class="text-sm text-slate-400 w-4/5 self-center"> Email Address </label>
    <input
      type="email"
      id="email"
      [ngModel]="contactStore.contactEdit()?.email"
      name="email"
      required
      class="px-3 py-1.5 text-md placeholder:text-slate-600 border text-slate-200 border-slate-700 rounded-md bg-slate-900 w-4/5 self-center focus:outline-none focus:ring-2 focus:ring-slate-600" />
  </div>

  <!-- Phone Number -->
  <div class="flex flex-col gap-1.5 w-full">
    <label for="phone" class="text-sm text-slate-400 w-4/5 self-center"> Phone Number </label>
    <input
      type="tel"
      id="phone"
      [ngModel]="contactStore.contactEdit()?.phone"
      name="phone"
      required
      class="px-3 py-1.5 text-md placeholder:text-slate-600 border text-slate-200 border-slate-700 rounded-md bg-slate-900 w-4/5 self-center focus:outline-none focus:ring-2 focus:ring-slate-600" />
  </div>

  <!-- Address -->
  <div class="flex flex-col gap-1.5 w-full">
    <label for="address" class="text-sm text-slate-400 w-4/5 self-center"> Address </label>
    <input
      type="text"
      id="address"
      [ngModel]="contactStore.contactEdit()?.address"
      name="address"
      required
      class="px-3 py-1.5 text-md placeholder:text-slate-600 border text-slate-200 border-slate-700 rounded-md bg-slate-900 w-4/5 self-center focus:outline-none focus:ring-2 focus:ring-slate-600" />
  </div>

  <!-- Button -->
  <button
    type="submit"
    [disabled]="miForm.invalid"
    class="disabled:cursor-not-allowed mt-4 w-4/5 text-slate-200 px-5 py-2.5 text-md font-medium rounded border border-slate-700 bg-sky-700 hover:bg-sky-500 cursor-pointer transition-colors">
    {{isEditMode()? 'Update': 'ADD CONTACT'}}
  </button>
  <div (click)="onCancel()"class="text-red-400 underline cursor-pointer">get back to contacts</div>
</form>
