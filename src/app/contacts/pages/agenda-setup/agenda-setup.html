<form class="w-md mx-auto mt-40 p-8 flex flex-col items-center gap-6 border border-black/40 shadow-2xl rounded-xl bg-slate-800">
  
  <!-- Título  -->
  <div class="text-center mb-2 flex gap-3 items-center">
      <i class="fa-regular fa-address-book text-5xl text-slate-200 scale-x-[-1] inline-block" ></i>
      <h2 class="text-2xl font-bold text-slate-200">Agenda Setup</h2>
  </div>

  <!-- Agenda Name Input  -->
  <div class="flex flex-col gap-1.5 w-full">
    <label for="agenda-name" class="text-sm text-slate-400 w-4/5 self-center">
      Agenda Name
    </label>
    <input
      type="text"
      id="agenda-name"
      class="px-3 py-2 text-md placeholder:text-slate-600 border text-slate-200 border-slate-700 rounded-md bg-slate-900 w-4/5 self-center focus:outline-none focus:ring-2 focus:ring-slate-600 transition-all"
      placeholder="work-contacts"
      required />
  </div>

  <!-- Radio Options  -->
  <div class="flex justify-around w-4/5 py-2">
    <label for="create-agenda" class="flex items-center gap-2 cursor-pointer text-sm font-medium text-slate-400 hover:text-slate-200 transition-colors">
      <input 
        id="create-agenda" 
        name="agenda-selection" 
        type="radio" 
        checked 
        class="w-4 h-4 accent-sky-600 cursor-pointer" />
      Create agenda
    </label>
    
    <label for="has-agenda" class="flex items-center gap-2 cursor-pointer text-sm font-medium text-slate-400 hover:text-slate-200 transition-colors">
      <input 
        id="has-agenda" 
        name="agenda-selection" 
        type="radio" 
        class="w-4 h-4 accent-sky-600 cursor-pointer" />
      I have agenda
    </label>
  </div>

  <!-- Button -->
  <button class="mt-2 w-4/5 text-slate-200 px-5 py-2.5 text-md font-medium rounded border border-slate-700 bg-sky-700 hover:bg-sky-500 cursor-pointer transition-all active:scale-95 shadow-lg">
    START
  </button>

</form>
