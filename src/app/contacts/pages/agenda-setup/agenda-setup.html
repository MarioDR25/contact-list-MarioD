<div
  class="w-md mx-auto mt-40 p-8 flex flex-col items-center gap-6 border border-black/40 shadow-2xl rounded-xl bg-slate-800">
  <!-- Título  -->
  <div class="text-center mb-2 flex gap-3 items-center">
    <i class="fa-regular fa-address-book text-5xl text-slate-200 scale-x-[-1] inline-block"></i>
    <h2 class="text-2xl font-bold text-slate-200">Agenda Setup</h2>
  </div>

  <!-- Agenda Name Input  -->
  <div class="flex flex-col gap-1.5 w-full">
    <label for="agenda-name" class="text-sm text-slate-400 w-4/5 self-center"> Agenda Name </label>
    <input
      type="text"
      id="agenda-name"
      class="px-3 py-2 text-md placeholder:text-slate-600 border text-slate-200 border-slate-700 rounded-md bg-slate-900 w-4/5 self-center focus:outline-none focus:ring-2 focus:ring-slate-600 transition-all"
      placeholder="work-contacts"
      (input)="updateName(textnameInput.value)"
      #textnameInput
      required />
  </div>

  <!-- Button -->
  <button
    type="button"
    [disabled]="isFormReady()"
    (click)="onStart()"
    class="disabled:opacity-50 disabled:cursor-not-allowed mt-2 w-4/5 text-slate-200 px-5 py-2.5 text-md font-medium rounded border border-slate-700 bg-sky-700 hover:bg-sky-500 cursor-pointer transition-all active:scale-95 shadow-lg">
    START
  </button>
</div>
