@for (item of contacts(); track $index) {
  <div class="flex items-center gap-4 bg-slate-800 border border-slate-700 rounded-xl p-4">
  <div class="w-12 h-12 rounded-full bg-sky-900 text-sky-200 flex items-center justify-center text-sm font-semibold shrink-0">
    MA
  </div>
  <div class="flex-1 flex flex-col gap-0.5">
    <h2 class="text-base font-medium text-slate-200">{{item.name}}</h2>
    <p class="text-xs text-slate-400">{{item.address}}</p>
    <p class="text-xs text-slate-400">{{item.phone}}</p>
    <p class="text-xs text-slate-400">{{item.email}}</p>
  </div>
  <div class="flex gap-3">
    <i (click)="onEdit(item.id)" class="fa-solid fa-pen-to-square cursor-pointer text-slate-400 border border-slate-700 rounded-lg p-2.5"></i>
    <i (click)="onRemove(item.id)" class="fa-solid fa-trash cursor-pointer text-slate-400 border border-slate-700 rounded-lg p-2.5"></i>
  </div>
</div>
}
