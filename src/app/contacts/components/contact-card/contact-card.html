<!-- MODAL -->
@if (isOpen) {
  <div class="fixed inset-0 z-50 flex items-center justify-center bg-black/60">
    <div
      class="relative bg-slate-800 border border-slate-700 rounded-xl shadow-sm p-6 w-full max-w-md mx-4 text-center"
    >
      <button
        type="button"
        (click)="close()"
        class="absolute top-3 right-3 text-slate-400 hover:text-slate-200 hover:bg-slate-700 rounded-lg w-8 h-8 flex items-center justify-center"
      >
        <i class="fa-solid fa-xmark"></i>
      </button>

      <i class="fa-regular fa-rectangle-xmark text-red-700 text-4xl mb-4 block"></i>

      <p class="text-slate-400 text-sm mb-6">
        Are you sure you want to delete this contact from your account?
      </p>

      <div class="flex items-center justify-center gap-3">
        <button
          (click)="confirmDelete()"
          type="button"
          class="bg-red-700 hover:bg-red-500 border border-red-700 text-white text-sm font-medium px-4 py-2.5 rounded-lg cursor-pointer focus:outline-none focus:ring-2 focus:ring-red-500"
        >
          Yes, I'm sure
        </button>
        <button
          (click)="close()"
          type="button"
          class="bg-transparent hover:bg-slate-700 border border-slate-700 text-slate-400 hover:text-slate-200 text-sm font-medium px-4 py-2.5 rounded-lg cursor-pointer focus:outline-none focus:ring-2 focus:ring-slate-500"
        >
          No, cancel
        </button>
      </div>
    </div>
  </div>
}
